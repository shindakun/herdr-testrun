[package]
name = "herdr-testrun"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin that runs a project's tests in a pane and sends failures to the agent"
license = "MIT"
repository = "https://github.com/shindakun/herdr-testrun"
readme = "README.md"
keywords = ["herdr", "test", "tui"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = ["fixtures/"]

[workspace]
exclude = ["fixtures"]

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[profile.release]
lto = true
strip = true
